<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>座席管理</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 16px;
      background: #fff7cc;
      text-align: center;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 20px;
    }
    .layout {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 420px;
      margin: 0 auto;
    }
    .seat {
      padding: 18px 0;
      border-radius: 8px;
      background: #ffd966;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      border: 2px solid #e6b800;
    }
    .seat.used {
      background: #ff7f7f;
      border-color: #cc0000;
      color: #fff;
    }
    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>売場 座席管理</h1>

  <div class="layout" id="layout"></div>

  <div class="note">
    席をタップすると「空席 / 使用中」が切り替わります
  </div>

  <script>
    const seats = [
      "A1","A2","A3","A4","A5",
      "A6","A7","A8","A9","A10",
      "A11","A12","A13","B1","B2",
      "B3","B4","B5","B6","B7"
    ];

    const layout = document.getElementById("layout");

    seats.forEach(id => {
      const div = document.createElement("div");
      div.className = "seat";
      div.textContent = id;

      const key = "seat_" + id;
      const saved = localStorage.getItem(key);
      if (saved === "used") {
        div.classList.add("used");
      }

      div.addEventListener("click", () => {
        div.classList.toggle("used");
        localStorage.setItem(key, div.classList.contains("used") ? "used" : "free");
      });

      layout.appendChild(div);
    });
  </script>
</body>
</html>
