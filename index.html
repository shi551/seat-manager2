<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>売場 座席管理（共有）</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 12px;
      background: #fff7cc;
      text-align: center;
    }
    h1 { font-size: 18px; margin: 8px 0 12px; }
    .layout {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 420px;
      margin: 0 auto;
    }
    .seat {
      padding: 14px 0;
      border-radius: 8px;
      background: #ffd966;
      border: 2px solid #e6b800;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }
    .seat.used {
      background: #ff7f7f;
      border-color: #cc0000;
      color: #fff;
    }
    .note { margin-top: 8px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>売場 座席管理（共有）</h1>

  <div class="layout" id="layout"></div>

  <div class="note">席をタップすると全員の画面に反映されます</div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBw_IzudCha13HNMWf07jRtCQSMZWJHVYg",
      authDomain: "seat-cd1ad.firebaseapp.com",
      projectId: "seat-cd1ad",
      storageBucket: "seat-cd1ad.firebasestorage.app",
      messagingSenderId: "115106177650",
      appId: "1:115106177650:web:0d31169041b52d5d1f98eb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const seats = [
      "A1","A2","A3","A4","A5",
      "A6","A7","A8","A9","A10",
      "A11","A12","A13"
    ];

    const layout = document.getElementById("layout");

    seats.forEach(id => {
      const div = document.createElement("div");
      div.className = "seat";
      div.textContent = id;
      layout.appendChild(div);

      const ref = doc(db, "seats", id);

      // リアルタイム反映
      onSnapshot(ref, (snap) => {
        if (snap.exists() && snap.data().used) {
          div.classList.add("used");
        } else {
          div.classList.remove("used");
        }
      });

      // タップで切り替え
      div.addEventListener("click", async () => {
        const used = div.classList.contains("used");
        await setDoc(ref, { used: !used });
      });
    });
  </script>
</body>
</html>
